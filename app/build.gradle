plugins {
    id 'com.android.application' version '8.5.0'
}

android {
    namespace 'com.example.coldturkey'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.coldturkey"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}